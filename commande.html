<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dar el halwa-patisserie fine tunisienne</title>
  </head>
  <body>
      <header>
        <h1>Dar el halwa </h1>
        Patisserie fine tunisienne depuis 1900 
        <figure>
        <img src="darelhalwa.jpg" alt=" darelhalwa">
        <figcaption>: Notre vitrine de mignardises traditionnelles.</figcaption>
      </figure>
      </header>
      <nav id="nv">
        <ul>
          <li> <a href="#props"> propos</a></li>
          <li> <a href="#produit"> nos produit</a> </li>
          <li><a href="#services"> services</a></li> 
          <li><a href="#contact"> Contact</a></li>
        </ul>
        <a href="carte.html">page carte</a>
      </nav>
      <main>
       <h2>commander un gateau personnalisé</h2>
       <form action="traitemment.php" method="post">
        <fieldset>
          <legend>vos commande</legend>
          <label for="nom">Nom :</label>
           <input type="text" id="nom" name="nom" required minlength="2">
          <br><br>
          <label for="prenom">Prénom :</label>
          <input type="text" id="prenom" name="prenom" required minlength="2">
          <br><br> 
          <label for="insta">instagrame :</label>
          <input type="text" id="insta" name="insta" placeholder="http//saisir votre compte">
          <br><br>
          <label for="email">Adresse électronique :</label> 
          <input type="email" id="email" name="email" placeholder="vous@exemple.tn" required>
         <br><br>
         <label for="telephone">Téléphone :</label>
          <input type="tel" id="telephone" name="telephone" pattern="\+216[0-9]{8}" title="Format attendu : +216 suivi de 8 chiffres" placeholder="+21612345678" required> 
          <br><br> 
          <label for="codepostal">Code postal :</label> 
          <input type="text" id="codepostal" name="codepostal" pattern="[0-9]{4}" title="Le code postal doit contenir exactement 4 chiffres" maxlength="4" required>
           <br><br> <label for="adresse">Adresse de livraison :</label>
            <textarea id="adresse" name="adresse" rows="3" cols="40"required>

            </textarea>
             <br><br> 
             <label for="gouvernorat">Gouvernorat :</label> 
             <select id="gouvernorat" name="gouvernorat" required>
            <option value="Sfax" selected>Sfax</option>
            <option value="Tunis">Tunis</option>
            <option value="Sousse">Sousse</option>
            <option value="Gabes">Gabès</option>
            <option value="Autre">Autre</option>
              </select>
              <br><br>
            <input type="submit" value="Envoyer">
            <input type="reset" value="Effacer">
        </fieldset>
        

    <fieldset>
        <legend>votre gateau</legend>
         <label for="occasion"></label>
        <input type="radio" id="occ-anniv"
               name="occasion" value="anniversaire" required>
        <label for="occ-anniv">Anniversaire</label>

        <input type="radio" id="occ-mariage"
               name="occasion" value="mariage">
        <label for="occ-mariage">Mariage</label>

        <input type="radio" id="occ-fiancailles"
               name="occasion" value="fiancailles">
        <label for="occ-fiancailles">Fiançailles</label>

        <input type="radio" id="occ-autre"
               name="occasion" value="autre">
        <label for="occ-autre">Autre</label>
      
        <label for="date">Date de retrait :</label>
        <input
            type="date"
            id="date"
            name="date"
            min="2026-09-01"
            required
        >

        <br><br>

        
        <label for="parts">Nombre de parts :</label>
        <input
            type="number"
            id="parts"
            name="parts"
            min="6"
            max="100"
            step="2"
            value="12"
        >

        <br><br>

      
        <fieldset>
            <legend>Parfums souhaités</legend>

            <label>
                <input
                    type="checkbox"
                    name="parfums"
                    value="chocolat"
                    checked
                >
                
            </label>

            <label>
                <input
                    type="checkbox"
                    name="parfums"
                    value="vanille"
                >
                
            </label>

            <label>
                <input
                    type="checkbox"
                    name="parfums"
                    value="pistache"
                >
                
            </label>

            <label>
                <input
                    type="checkbox"
                    name="parfums"
                    value="fruits rouges"
                >
                
            </label>
        </fieldset>

        <br>

      
        <label for="sucre">Niveau de sucre :</label>
        <input
            type="range"
            id="sucre"
            name="sucre"
            min="0"
            max="10"
            step="1"
            value="5"
        >

        <br><br>

        
        <label for="couleur">Couleur du glaçage :</label>
        <input
            type="color"
            id="couleur"
            name="couleur"
            value="#c8912a"
        >

        <br><br>

        <!-- Message sur le gâteau -->
        <label for="message">Message sur le gâteau :</label>
        <input
            type="text"
            id="message"
            name="message"
            maxlength="30"
        >

        <br><br>

        <!-- Photo de modèle -->
        <label for="photo">Photo de modèle :</label>
        <input
            type="file"
            id="photo"
            name="photo"
            accept="image/*"
        >

        <br><br>

       
        

        <label for="decors">Langages de décoration :</label>
   <select multiple size="4" id="decors" name="decors">
    <optgroup label="decore sucré">
      <option value="fleurs">Fleurs en pâte à sucre</option>
      <option value="fruits">Fruits frais</option>
      </optgroup>
      <optgroup label="decore frait">
        
        <option value="chocolat">Décoration en chocolat</option>
        <option value="perles">Perles de sucre</option>
    </optgroup>
</select>
<br><br>
<label for="precisions">Précisions :</label>
<textarea id="precisions" name="precisions" rows="4" cols="40" maxlength="200"></textarea>
<br><br>
     <button type="submit">Envoyer la commande</button>
        <button type="reset">Réinitialiser</button>
      </fieldset>
    
       </form>
      </main>

  </body>
</html>
